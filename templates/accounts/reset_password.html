{% extends 'base.html' %}
{% load static %}

{% block title %} E-SHOP @ Reset Password {% endblock %}

{% block content %}
<section>
    <div class="card  reset-container">
        <div class="card-body">
            <h2 class="reset_header">Reset Password:</h2>
            {% include 'includes/alerts.html' %}
                <form action="{% url 'reset_password' %}" method="POST">
                {% csrf_token %}
                    <div class="form-group">
                        <label for="email">Enter your registered email:</label>
                        <input type="email" class="form-control" placeholder='Check your email after submitting' name="email">
                    </div>
                    <div class="form-group">
                        <a class="cart-link" href="{% url 'signin' %}">Back to Login Page</a>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn">SUBMIT</button>
                    </div>
                </form>
            </div>
        </div>
        <p class="signin-no-account ">
            Don't have an account?
        </p>
        <div class="signin-btn-container">
            <a class="btn" href="{% url 'register' %}">REGISTER HERE</a>
        </div>
    <br>
    <br>
</section>
{% endblock %}
